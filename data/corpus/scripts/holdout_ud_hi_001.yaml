id: holdout_ud_hi_001
language: hi-IN
label: utility_disconnect
legit_kind: null
difficulty: hard
split: holdout
turns:
- speaker: caller
  text: बिजली विभाग कंट्रोल रूम से जूनियर इंजीनियर बोल रहा हूँ। आपका मीटर कनेक्शन
    नंबर चेक कीजिए।
- speaker: victim
  text: हाँ साहब, क्या समस्या है? हमने तो बिल समय पर भर दिया था।
- speaker: caller
  text: पिछले तीन महीने का बिजली बिल सॉफ्टवेयर में अपडेट नहीं हुआ है। अगले एक घंटे
    में लाइनमैन आपकी बिजली काट देगा।
- speaker: victim
  text: साहब कल बच्चों की बोर्ड परीक्षा है, बिजली कट जाएगी तो बहुत दिक्कत होगी!
- speaker: caller
  text: अगर लाइन कटने से बचना है तो तुरंत हमारे द्वारा भेजे गए लिंक पर जाकर बकाया
    बिल का भुगतान कीजिए, वरना कनेक्शन कट जाएगा।
- speaker: victim
  text: साहब लिंक भेजिए, मैं तुरंत पेमेंट करने की कोशिश करता हूँ।
