  text: बैंक अधिकारी कभी भी फोन या वीडियो कॉल पर आपसे पासवर्ड, एटीएम पिन या ओटीपी नहीं मांगते। किसी भी व्यक्ति को अपना गोपनीय कोड कभी न बताएं।
- speaker: victim
  text: जी धन्यवाद, मैं अपना पिन कभी किसी से साझा नहीं करता।
