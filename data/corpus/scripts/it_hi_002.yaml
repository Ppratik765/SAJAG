turns:
- speaker: caller
  text: पार्ट टाइम जॉब रिक्रूटमेंट टीम। होटल रिव्यु टास्क पूरा करके डेली हाई प्रॉफिट
    विथड्रॉ कीजिए।
- speaker: victim
  text: मुझे इस काम में दिलचस्पी है, बताइए।
- speaker: caller
  text: पहले टास्क के तीन सौ रुपये आपको मिल चुके हैं। अब लेवल टू अनलॉक करने के लिए
    दस हजार का रिचार्ज फंड ट्रांसफर कीजिए।
- speaker: victim
  text: लेकिन काम करने के लिए मुझे पैसे क्यों जमा करने पड़ेंगे?
- speaker: caller
  text: यह क्रिप्टो ट्रेडिंग सिक्योरिटी फंड है सर, टास्क पूरा होते ही बीस हजार रुपये
    वापस खाते में आ जाएंगे।
- speaker: victim
  text: नहीं सर, पहले से पैसे मांगना फ्रॉड का लक्षण है।
