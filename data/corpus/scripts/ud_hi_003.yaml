language: hi-IN
label: utility_disconnect
legit_kind: null
difficulty: hard
split: test
turns:
- speaker: caller
  text: राज्य विद्युत बोर्ड। प्रिय उपभोक्ता, आपका बकाया बिजली बिल जमा न होने के कारण
    आज रात को बिजली सप्लाई बंद होगी।
- speaker: victim
  text: मुझे कोई पूर्व नोटिस नहीं मिला था।
- speaker: caller
  text: डिजिटल नोटिस पहले ही भेजा जा चुका है। कनेक्शन बचाने के लिए तुरंत हमारे सुपरवाइजर
    के खाते में बिल जमा करवाएं।
- speaker: victim
  text: सरकारी खाते की जगह सुपरवाइजर का खाता क्यों?
- speaker: caller
  text: रात का समय है सर, इमरजेंसी रिकवरी काउंटर चालू है। नहीं भरेंगे तो अंधेरे में
    रहना पड़ेगा।
- speaker: victim
  text: मुझे यह संदिग्ध लग रहा है, मैं कल दफ्तर जाकर बात करूँगा।
