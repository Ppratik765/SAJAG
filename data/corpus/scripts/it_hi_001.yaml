turns:
- speaker: caller
  text: नमस्ते, क्या आप घर बैठे रोजाना दो से तीन हजार रुपये कमाना चाहते हैं?
- speaker: victim
  text: हाँ, काम क्या करना होगा?
- speaker: caller
  text: काम बहुत आसान है मैडम। यूट्यूब वीडियो लाइक करना है और गूगल मैप्स पर रेटिंग
    देनी है। हमारे वीआईपी टेलीग्राम ग्रुप से जुड़िए।
- speaker: victim
  text: इसके लिए कोई फीस तो नहीं लगेगी?
- speaker: caller
  text: शुरू में सौ रुपये मिलेंगे। फिर बड़ा मुनाफा कमाने के लिए आपको ट्रेडिंग टास्क
    में पांच हजार रुपये इन्वेस्ट करने होंगे। पैसे दोगुने हो जाएंगे।
- speaker: victim
  text: पैसे दोगुने करने वाली बातें हमेशा फर्जी होती हैं।
