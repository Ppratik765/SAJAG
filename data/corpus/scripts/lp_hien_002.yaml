turns:
- speaker: caller
  text: Lucky draw reward manager calling. Your mobile number won bumper prize of
    ten lakh cash.
- speaker: victim
  text: Which lucky draw? I never registered.
- speaker: caller
  text: Telecom operator national contest sir. Certificate issue karne ke liye registration
    fee five thousand rupees bhejiye.
- speaker: victim
  text: Sounds like a standard lottery scam.
