  text: नमस्ते सर, मेट्रो डायग्नोस्टिक सेंटर से रिसेप्शनिस्ट बोल रही हूँ।
- speaker: victim
  text: नमस्ते, कल सुबह के ब्लड टेस्ट के बारे में कॉल है?
