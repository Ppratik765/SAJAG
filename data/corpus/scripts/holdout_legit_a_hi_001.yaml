- speaker: victim
  text: हाँ बिल्कुल, मैं रात दस बजे के बाद कुछ नहीं खाऊंगा।
- speaker: caller
  text: धन्यवाद सर, कल सुबह आठ बजे लैब में मिलते हैं।
