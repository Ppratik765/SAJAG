turns:
- speaker: caller
  text: शेयर मार्केट गारंटीड रिटर्न कंसल्टेंसी से निवेश सलाहकार। हमारे स्पेशल वीआईपी
    चैनल पर सौ प्रतिशत गारंटीड रिटर्न मिलता है।
- speaker: victim
  text: शेयर बाजार में गारंटी कैसे मिल सकती है?
- speaker: caller
  text: हम इनसाइडर ट्रेडिंग टिप्स देते हैं सर। बस पचास हजार रुपये हमारे फंड मैनेजर
    के खाते में ट्रांसफर कीजिए, हर हफ्ते पच्चीस हजार मुनाफा मिलेगा।
- speaker: victim
  text: सेबी का नियम है कि कोई गारंटीड रिटर्न का वादा नहीं कर सकता।
- speaker: caller
  text: हम प्राइवेट क्लब हैं सर, सेबी के बाहर काम करते हैं। मौका हाथ से मत जाने दीजिए।
- speaker: victim
  text: यह गैरकानूनी है, मैं सेबी में आपकी शिकायत करूँगा।
