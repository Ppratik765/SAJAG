language: hi-IN
label: family_emergency
legit_kind: null
difficulty: easy
split: dev
turns:
- speaker: caller
  text: पापा, पापा मेरी बात सुनो, मैं बहुत बड़ी मुसीबत में फँस गया हूँ!
- speaker: victim
  text: अरे रोहन! क्या हुआ बेटा? तुम्हारी आवाज इतनी अजीब क्यों लग रही है?
- speaker: caller
  text: पापा मेरा कॉलेज में कार एक्सीडेंट हो गया, पुलिस ने मुझे हवालात में बंद कर
    दिया है। प्लीज बचा लो!
- speaker: victim
  text: हे भगवान! तुम ठीक तो हो ना? चोट तो नहीं लगी?
- speaker: caller
  text: इंस्पेक्टर बोल रहा है अगर तुरंत पच्चीस हजार जमानत के नहीं भरे तो जेल भेज देंगे।
    किसी को मत बताना, तुरंत पैसे ट्रांसफर कर दो!
- speaker: victim
  text: रुक बेटा, मैं तेरी मम्मी और चाचा जी को फोन मिलाता हूँ।
