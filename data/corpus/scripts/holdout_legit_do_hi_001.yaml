- speaker: victim
  text: हाँ भैया, मैं घर पर ही हूँ, घंटी बजा दीजिए।
- speaker: caller
  text: दरवाजे पर खड़ा हूँ भैया, पार्सल देने के लिए आपके मोबाइल पर आया हुआ चार अंकों
    का डिलीवरी ओटीपी बता दीजिए।
- speaker: victim
  text: हाँ एक मिनट, डिलीवरी ओटीपी है आठ, तीन, एक, पाँच।
- speaker: caller
  text: ओटीपी मैच हो गया भैया, यह रहा आपका पार्सल, धन्यवाद।
