- speaker: caller
  text: सब बहुत अच्छा है मौसी जी। अगले महीने दीपावली पर घर आ रही हूँ।
- speaker: victim
  text: अरे वाह! बहुत खुशी की बात है। तुम्हारे पसंद के बेसन के लड्डू बना कर रखूँगी।
