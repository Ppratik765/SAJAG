turns:
- speaker: caller
  text: बधाई हो सर! मैं कौन बनेगा करोड़पति हेड ऑफिस मुंबई से डायरेक्टर वर्मा बात कर
    रहा हूँ।
- speaker: victim
  text: हाँ जी, क्या बात है?
- speaker: caller
  text: आपके मोबाइल नंबर को ऑल इंडिया लकी ड्रॉ में पच्चीस लाख रुपये की लॉटरी लगी है!
    बहुत-बहुत बधाई!
- speaker: victim
  text: पच्चीस लाख? लेकिन मैंने तो केबीसी में भाग ही नहीं लिया था।
- speaker: caller
  text: यह ऑटोमैटिक मोबाइल नंबर लकी ड्रॉ था सर। इनाम का चेक रिलीज करने के लिए सरकारी
    टैक्स और प्रोसेसिंग फीस के पंद्रह हजार जमा कीजिए।
- speaker: victim
  text: इनाम से ही पंद्रह हजार काटकर बाकी पैसे भेज दीजिए ना?
