turns:
- speaker: caller
  text: Department of Telecommunications automated customer security announcement.
- speaker: victim
  text: Hello, listening.
- speaker: caller
  text: Mobile subscribers are warned against calls threatening mobile disconnection or SIM deactivation. Telecom service providers never ask for bank transfer or sensitive KYC verification over phone.
- speaker: victim
  text: Thanks for informing me.
- speaker: caller
  text: Never share your Aadhaar number or OTP with anyone claiming to prevent number disconnection.
