- speaker: victim
  text: जी, मुझे पता चला था कि ऐसे फर्जी कॉल आ रहे हैं।
- speaker: caller
  text: ऐसे किसी भी डराने वाले कॉल से घबराएं नहीं। फोन काटें और तुरंत राष्ट्रीय साइबर हेल्पलाइन एक नौ तीन शून्य पर अपनी शिकायत दर्ज कराएं।
