id: holdout_da_hi_001
language: hi-IN
label: digital_arrest
legit_kind: null
difficulty: hard
split: holdout
turns:
- speaker: caller
  text: नमस्ते, मैं दिल्ली पुलिस क्राइम ब्रांच हेडक्वार्टर से डीएसपी कुलदीप बात कर
    रहा हूँ। क्या आप शांत जगह पर हैं?
- speaker: victim
  text: हाँ साहब, बोलिए। क्या बात हो गई अचानक?
- speaker: caller
  text: कैनरा बैंक की चाणक्यपुरी शाखा में आपके नाम पर खुला संदिग्ध खाता हवाला लेन-देन
    और गैरकानूनी धन शोधन में पकड़ा गया है। सुप्रीम कोर्ट के निर्देशानुसार आपके खिलाफ
    अरेस्ट वारंट जारी हुआ है।
- speaker: victim
  text: साहब मेरा दिल्ली में कोई खाता नहीं है, मैं तो शिक्षक हूँ, मेरा इससे कोई वास्ता
    नहीं है।
- speaker: caller
  text: जाँच पूरी होने तक आप डिजिटल अरेस्ट में रहेंगे। अपने कमरे की कुंडी लगा लीजिए,
    किसी परिजन को मत बताइए, और तुरंत व्हाट्सएप वीडियो कॉल पर लाइव रहिए।
- speaker: victim
  text: जी साहब, मैं दरवाजा बंद कर रहा हूँ, प्लीज मेरी बात सुन लीजिए।
