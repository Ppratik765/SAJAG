- speaker: caller
  text: Hello, this is a public safety advisory broadcast from the Cyber Crime Prevention Cell.
- speaker: victim
  text: Go ahead, what is this regarding?
- speaker: caller
  text: Please be aware that law enforcement agencies and court officers never place people under digital arrest or conduct interrogations over WhatsApp or Skype. There is no provision for digital arrest under Indian criminal law.
