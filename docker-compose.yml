services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sajag-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ALLOW_NO_ORIGIN=false
      - TRUST_PROXY=true
      - DAILY_STT_SECONDS_CAP=1800
      - DAILY_TTS_CHARS_CAP=20000
      - DAILY_LIVE_SESSIONS_CAP=50
      - MAX_LIVE_SESSIONS=3
      - MAX_LIVE_SESSIONS_PER_IP=2
      - MAX_LIVE_SESSION_SECONDS=180
      - MAINTENANCE_MODE=false
      - GNANI_API_KEY=${GNANI_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - BUILD_COMMIT=${BUILD_COMMIT:-compose}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sajag-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
